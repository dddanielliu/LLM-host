services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ./models:/models:ro
      - ./modelfiles:/modelfiles:ro
      - ./ollama_data:/root/.ollama
      - ./taide-import:/taide:ro
    environment:
      - OLLAMA_CONTEXT_LENGTH=16384
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_KEEP_ALIVE=30m
      - OLLAMA_FLASH_ATTENTION=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # One-shot: (re)imports the local GGUF files into Ollama on `up`.
  # No-op when the model is already in ./ollama_data, so it is safe on every start.
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ./models:/models:ro
      - ./modelfiles:/modelfiles:ro
      - ./taide-import:/taide:ro
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        ensure() {
          name="$$1"; modelfile="$$2"; gguf="$$3"
          if ollama list | awk 'NR>1 {print $$1}' | grep -qx "$$name:latest"; then
            echo "[init] $$name already imported, skipping"
            return 0
          fi
          if [ ! -f "$$gguf" ]; then
            echo "[init] WARNING: $$gguf not found, cannot create $$name" >&2
            return 0
          fi
          echo "[init] importing $$name from $$gguf"
          ollama create "$$name" -f "$$modelfile"
        }
        # ensure qwen3.8-27b-q4   /modelfiles/Modelfile.qwen3.8-27b-q4km   /models/Qwen3.8-27B-UD-Q4_K_M.gguf   # commented out - already imported via ollama_data
        ensure qwen3.8-27b-q3xl /modelfiles/Modelfile.qwen3.8-27b-q3xl   /models/Qwen3.8-27B-UD-Q3_K_XL.gguf
        ensure taide-q4km       /modelfiles/Modelfile.taide-q4km         /taide/Llama-3.1-TAIDE-LX-8B-Chat-Q4_K_M.gguf
        pull_if_missing() {
          name="$$1"
          if ollama list | awk 'NR>1 {print $$1}' | grep -qx "$$name"; then
            echo "[init] $$name already present, skipping"
            return 0
          fi
          echo "[init] pulling $$name"
          ollama pull "$$name"
        }
        pull_if_missing qwen3:8b
        pull_if_missing qwen3.5:9b
        pull_if_missing gemma4:e4b
        pull_if_missing llama3:8b
        pull_if_missing llama3.1:8b-instruct-q4_K_M
        # pull_if_missing Yu-Feng/Llama-3.1-TAIDE-LX-8B-Chat:Q4_K_M   # trying Modelfile import instead
        pull_if_missing ornith:9b
        echo "[init] done"
    restart: "no"

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    ports:
      - "4000:4000" # LiteLLM 預設暴露 4000 端口作為 API 門戶
    environment:
      - DATABASE_URL=postgresql://litellm_user:litellm_secure_password@litellm-db:5432/litellm
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
      - ./litellm/custom_callbacks.py:/app/custom_callbacks.py:ro
    command: [ "--config", "/app/config.yaml", "--port", "4000" ]
    depends_on:
      litellm-db:
        condition: service_started
      ollama:
        condition: service_healthy
    restart: unless-stopped
  litellm-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm_user
      POSTGRES_PASSWORD: litellm_secure_password # 請修改為你的密碼
    volumes:
      - ./postgres_data:/var/lib/postgresql/18/docker/
    restart: unless-stopped

